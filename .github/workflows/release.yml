name: PyPI release

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/release.yml
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the verified wheel and sdist to PyPI
        type: boolean
        default: false
      version:
        description: Expected package version, required when publishing
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.11'
      - name: Check requested release version
        if: inputs.publish || inputs.version != ''
        env:
          EXPECTED_VERSION: ${{ inputs.version }}
        run: |
          actual_version=$(python -c 'import tomllib; print(tomllib.loads(open("pyproject.toml").read())["project"]["version"])')
          if [[ ! "$EXPECTED_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ || "$EXPECTED_VERSION" != "$actual_version" ]]; then
            echo "::error::Enter the stable version from pyproject.toml ($actual_version)."
            exit 1
          fi
      - name: Build and test wheel and sdist
        run: sh scripts/check-sdk.sh
      - name: Check artifact integrity
        working-directory: dist
        run: sha256sum --check --strict SHA256SUMS
      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        id: upload
        with:
          name: pypi-release-candidate
          path: |
            dist/*.whl
            dist/*.tar.gz
            dist/SHA256SUMS
          if-no-files-found: error

  publish:
    if: github.event_name == 'workflow_dispatch' && inputs.publish && github.ref == 'refs/heads/main' && github.repository == 'cameo6/gmt-python-sdk'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: pypi
    concurrency:
      group: pypi-publish
      cancel-in-progress: false
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.build.outputs.artifact-id }}
          path: artifacts
      - name: Verify distributions
        working-directory: artifacts
        run: |
          sha256sum --check --strict SHA256SUMS
          mkdir ../dist
          mv -- ./*.whl ./*.tar.gz ../dist/
      - name: Publish the tested distributions
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
